<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADSA Digital Notice Board | Official Launch</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Light/White background */
            background: #f8fafc; 
            overflow: hidden;
            position: relative;
        }

        /* --- Animated Glowing Blobs (Lighter for White BG) --- */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
            animation: float 12s infinite alternate ease-in-out;
        }
        .blob-1 {
            width: 450px;
            height: 450px;
            background: #93c5fd; /* Soft Blue */
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: #c4b5fd; /* Soft Purple */
            bottom: -150px;
            right: -100px;
            animation-delay: -3s;
        }
        .blob-3 {
            width: 350px;
            height: 350px;
            background: #6ee7b7; /* Soft Mint/Cyan */
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -60px) scale(1.15); }
        }

        /* --- Glassmorphism Card (Adapted for Light BG) --- */
        .glass-card {
            position: relative;
            z-index: 10;
            /* More opaque white to stand out against light bg */
            background: rgba(255, 255, 255, 0.65); 
            /* The Frosted Glass Blur */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            /* Crisp white borders */
            border: 1px solid rgba(255, 255, 255, 1);
            /* Soft shadow for depth */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            padding: 60px 80px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            /* Entry animation */
            animation: popIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 170px;
            height: auto;
            /* Adjusted shadow for white bg */
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
            transition: transform 0.5s ease;
        }
        
        .logo-container img:hover {
            transform: scale(1.05);
        }

        .title {
            color: #0f172a; /* Dark text */
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #64748b; /* Slate gray */
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 50px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* --- Stylish Button --- */
        .launch-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: #ffffff;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
            filter: brightness(1.1);
        }

        .launch-btn:active {
            transform: translateY(1px);
        }

        .footer-text {
            margin-top: 40px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .glass-card {
                padding: 40px 30px;
            }
            .title {
                font-size: 28px;
            }
            .launch-btn {
                padding: 15px 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Light Animated Glowing Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- The Frosted Glass Card -->
    <div class="glass-card">
        <div class="logo-container">
            <img src="logo.png" alt="ADSA Logo">
        </div>
        
        <h1 class="title">ADSA Digital Notice Board</h1>
        <div class="subtitle">Official Launch Portal</div>
        
        <button class="launch-btn" onclick="launchBoard()">Launch Now</button>

        <div class="footer-text">SECURE ADMIN ACCESS</div>
    </div>

    <script>
        function launchBoard() {
            const btn = document.querySelector('.launch-btn');
            btn.innerHTML = 'LAUNCHING...';
            btn.style.opacity = '0.8';
            
            setTimeout(() => {
                window.location.href = "https://adsa-updates.web.app/admin";
            }, 600);
        }
    </script>
</body>
</html>
